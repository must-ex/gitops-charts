global:
  awsRegion: "ap-northeast-2"
  esoRoleArn: ""

# Datadog Operator subchart (https://github.com/DataDog/helm-charts/tree/main/charts/datadog-operator).
# Pinned in Chart.yaml (dependencies[0].version) — bump both together.
datadog-operator:
  installCRDs: true
  resources:
    requests: { cpu: "100m", memory: "100Mi" }
    limits: { cpu: "200m", memory: "200Mi" }

# Rendered as the DatadogAgent (datadoghq.com/v2alpha1) CR that the operator above reconciles.
datadogAgent:
  enabled: true
  site: datadoghq.com
  clusterName: "dafault-cluster-name"
  env: ""
  credentials:
    apiSecretName: "datadog-secret"
    apiSecretKey: "api-key"
  # Autodiscovery container-include filter (kube_namespace:<ns>) — restricts the Agent's
  # metrics AND log collection to these namespaces. Empty list = cluster-wide, no filter.
  scopedNamespaces: []
  orchestratorExplorer:
    enabled: true
  clusterChecks:
    enabled: true
  logCollection:
    enabled: true
    containerCollectAll: true
    processingRules: []
  apm:
    enabled: true
    # Per-target tracer config, rendered as apm.instrumentation.targets on the CR.
    # Each target scopes ddTraceConfigs (DD_* env vars set on injected tracers) to a
    # namespaceSelector — use this instead of editing individual app Deployments,
    # since instrumentation here is single-step/admission-controller injected.
    # Example (DBM<->APM correlation):
    #   targets:
    #     - name: finora-ex-dev-dbm
    #       namespaceSelector:
    #         matchNames: ["finora-ex-dev"]
    #       ddTraceConfigs:
    #         - name: DD_DBM_PROPAGATION_MODE
    #           value: "full"
    targets: []
  # Map of <integration>.yaml -> raw integration config (string). Each entry is mounted
  # into the Cluster Agent's conf.d and, with `cluster_check: true` inside the config,
  # dispatched as a cluster check. Used for endpoint-based checks (RDS postgres DBM,
  # ElastiCache redisdb) that have no pod to autodiscover. Setting any entry also enables
  # the k8s secret backend so configs can use ENC[k8s_secret@ns/secret/key] references.
  clusterCheckConfigs: {}

# External Secrets Operator — syncs the Datadog API key from AWS Secrets Manager into the
# plain k8s Secret referenced by datadogAgent.credentials above.
externalSecret:
  enabled: false
  refreshInterval: "1h"
  secretStoreName: "datadog-secret-store"
  targetSecretName: "datadog-secret"
  remoteRef:
    key: ""
    property: "DD_API_KEY"

secretStore:
  enabled: false
  name: "datadog-secret-store"
