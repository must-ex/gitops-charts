{{- if .Values.datadogAgent.enabled }}
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: {{ include "datadog.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datadog.labels" . | nindent 4 }}
spec:
  global:
    clusterName: {{ required "datadogAgent.clusterName is required" .Values.datadogAgent.clusterName | quote }}
    site: {{ .Values.datadogAgent.site }}
    {{- if .Values.datadogAgent.env }}
    tags:
      - "env:{{ .Values.datadogAgent.env }}"
    {{- end }}
    credentials:
      apiSecret:
        secretName: {{ .Values.datadogAgent.credentials.apiSecretName }}
        keyName: {{ .Values.datadogAgent.credentials.apiSecretKey }}
    {{- if .Values.datadogAgent.clusterCheckConfigs }}
    # Lets check configs reference k8s Secrets via ENC[k8s_secret@<ns>/<secret>/<key>]
    # (used by the DBM postgres check password below) without baking credentials into
    # this CR. The helper script ships in the official agent/cluster-agent images.
    secretBackend:
      command: "/readsecret_multiple_providers.sh"
    {{- end }}
    {{- if .Values.datadogAgent.scopedNamespaces }}
    # DD_CONTAINER_INCLUDE — there is no dedicated global.containerInclude CRD field;
    # this filter is only exposed via the Agent env var (space-separated filters).
    #
    # DD_CONTAINER_INCLUDE/EXCLUDE alone do NOT scope log collection when
    # logCollection.containerCollectAll is true — collect-all mode reads every
    # container's logs regardless of those filters. DD_CONTAINER_INCLUDE_LOGS /
    # DD_CONTAINER_EXCLUDE_LOGS are the dedicated overrides for that mode: exclude
    # everything by default, then include only the scoped namespaces.
    env:
      - name: DD_CONTAINER_INCLUDE
        value: "{{ range $i, $ns := .Values.datadogAgent.scopedNamespaces }}{{ if $i }} {{ end }}kube_namespace:{{ $ns }}{{ end }}"
      - name: DD_CONTAINER_EXCLUDE_LOGS
        value: "name:.*"
      - name: DD_CONTAINER_INCLUDE_LOGS
        value: "{{ range $i, $ns := .Values.datadogAgent.scopedNamespaces }}{{ if $i }} {{ end }}kube_namespace:{{ $ns }}{{ end }}"
    {{- end }}
  features:
    orchestratorExplorer:
      enabled: {{ .Values.datadogAgent.orchestratorExplorer.enabled }}
    clusterChecks:
      enabled: {{ .Values.datadogAgent.clusterChecks.enabled }}
    logCollection:
      enabled: {{ .Values.datadogAgent.logCollection.enabled }}
      containerCollectAll: {{ .Values.datadogAgent.logCollection.containerCollectAll }}
    apm:
      instrumentation:
        enabled: {{ .Values.datadogAgent.apm.enabled }}
  {{- if .Values.datadogAgent.clusterCheckConfigs }}
  # Integration configs with `cluster_check: true` (e.g. postgres DBM, redisdb against
  # RDS/ElastiCache endpoints) are mounted into the Cluster Agent's conf.d and dispatched
  # to node agents as cluster checks — they monitor endpoints, not pods, so autodiscovery
  # annotations don't apply.
  override:
    clusterAgent:
      extraConfd:
        configDataMap:
          {{- range $file, $conf := .Values.datadogAgent.clusterCheckConfigs }}
          {{ $file }}: |-
            {{- $conf | nindent 12 }}
          {{- end }}
  {{- end }}
{{- end }}
