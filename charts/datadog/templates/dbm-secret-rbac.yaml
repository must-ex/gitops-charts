{{- if and .Values.datadogAgent.enabled .Values.datadogAgent.clusterCheckConfigs .Values.datadogAgent.checkSecretNames }}
# Lets the Datadog agents resolve ENC[k8s_secret@<ns>/<secret>/<key>] references in
# clusterCheckConfigs via the secret backend (/readsecret_multiple_providers.sh).
# Both SAs need it: the Cluster Agent loads/validates the check config, and the check
# is dispatched to a node agent which resolves the secret again at run time. The SA
# names are fixed by the operator from the DatadogAgent CR name ({{ include "datadog.name" . }}).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "datadog.name" . }}-check-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datadog.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range .Values.datadogAgent.checkSecretNames }}
      - {{ . | quote }}
      {{- end }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "datadog.name" . }}-check-secret-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datadog.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "datadog.name" . }}-check-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "datadog.name" . }}-agent
    namespace: {{ .Release.Namespace }}
  - kind: ServiceAccount
    name: {{ include "datadog.name" . }}-cluster-agent
    namespace: {{ .Release.Namespace }}
{{- end }}
