{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "custody.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
    {{- if $svc.unifiedServiceTagging }}
    tags.datadoghq.com/env: {{ $.Values.global.environment | quote }}
    tags.datadoghq.com/service: {{ $name | quote }}
    tags.datadoghq.com/version: {{ $svc.image.tag | quote }}
    {{- end }}
  {{- if $svc.reloader }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ $svc.replicaCount | default 1 }}
  {{- /*
  Rollout strategy. Defaults to Kubernetes' own RollingUpdate 25%/25% when unset, which
  is right for every replicated service.

  It is WRONG for a singleton scheduler. At replicaCount 1, maxSurge 25% rounds UP to 1
  and maxUnavailable 25% rounds DOWN to 0, so Kubernetes starts the replacement before
  terminating the original — two pods run concurrently for the length of the readiness
  gate plus the termination grace period. For an HTTP service that is the point. For a
  `celery beat` scheduler holding no lock it means every periodic task due in that window
  is dispatched twice.

  Set `strategy: {type: Recreate}` on those services. It trades a short scheduling gap
  (recoverable) for the guarantee of no overlap (a duplicated funds task may not be).
  */}}
  {{- with $svc.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "custody.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "custody.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        {{- if $svc.unifiedServiceTagging }}
        tags.datadoghq.com/env: {{ $.Values.global.environment | quote }}
        tags.datadoghq.com/service: {{ $name | quote }}
        tags.datadoghq.com/version: {{ $svc.image.tag | quote }}
        {{- end }}
        {{- if $svc.apmInstrumentation }}
        admission.datadoghq.com/enabled: "true"
        {{- end }}
      {{- if $svc.reloader }}
      annotations:
        reloader.stakater.com/auto: "true"
      {{- end }}
    spec:
      serviceAccountName: {{ if and $svc.serviceAccount $svc.serviceAccount.create }}{{ $svc.serviceAccount.name | default $name }}{{ else if and $svc.serviceAccount $svc.serviceAccount.name }}{{ $svc.serviceAccount.name }}{{ else }}{{ include "custody.serviceAccountName" $ }}{{ end }}
      securityContext:
        {{- mergeOverwrite (deepCopy ($.Values.securityContext.pod | default dict)) ($svc.podSecurityContext | default dict) | toYaml | nindent 8 }}
      {{- if $svc.nodeSelector }}
      nodeSelector:
        {{- toYaml $svc.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if $svc.tolerations }}
      tolerations:
        {{- toYaml $svc.tolerations | nindent 8 }}
      {{- end }}
      {{- if $svc.affinity }}
      affinity:
        {{- toYaml $svc.affinity | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- mergeOverwrite (deepCopy ($.Values.securityContext.container | default dict)) ($svc.securityContext | default dict) | toYaml | nindent 12 }}
          {{- if $svc.command }}
          command:
            {{- toYaml $svc.command | nindent 12 }}
          {{- end }}
          {{- if $svc.args }}
          args:
            {{- toYaml $svc.args | nindent 12 }}
          {{- end }}
          {{- if $svc.containerPort }}
          ports:
            - name: http
              containerPort: {{ $svc.containerPort }}
              protocol: TCP
          {{- end }}
          {{- if $svc.envFrom }}
          envFrom:
            {{- toYaml $svc.envFrom | nindent 12 }}
          {{- end }}
          {{- if or $svc.env $svc.unifiedServiceTagging }}
          env:
            {{- if $svc.unifiedServiceTagging }}
            - name: DD_ENV
              value: {{ $.Values.global.environment | quote }}
            - name: DD_SERVICE
              value: {{ $name | quote }}
            - name: DD_VERSION
              value: {{ $svc.image.tag | quote }}
            {{- end }}
            {{- if $svc.env }}
            {{- toYaml $svc.env | nindent 12 }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- if $svc.probes }}
          {{- if $svc.probes.startup }}
          startupProbe:
            {{- toYaml $svc.probes.startup | nindent 12 }}
          {{- end }}
          {{- if $svc.probes.liveness }}
          livenessProbe:
            {{- toYaml $svc.probes.liveness | nindent 12 }}
          {{- end }}
          {{- if $svc.probes.readiness }}
          readinessProbe:
            {{- toYaml $svc.probes.readiness | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- if $svc.volumeMounts }}
          volumeMounts:
            {{- toYaml $svc.volumeMounts | nindent 12 }}
          {{- end }}
      {{- if $svc.volumes }}
      volumes:
        {{- toYaml $svc.volumes | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
