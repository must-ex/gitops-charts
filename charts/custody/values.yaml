global:
  ecrRegistry: ""
  esoSecretName: "changeme" # required by schema; always overridden per-env
  esoRoleArn: ""
  awsRegion: "ap-northeast-2"
  domain: ""
  acmCertificateArn: ""

# Pod-level security context applied to all pods (can be overridden per service via podSecurityContext)
securityContext:
  pod: {}
  container: {}

serviceAccount:
  create: true
  name: ""

services: {}

ingress:
  enabled: false
  className: alb
  annotations: {}
  rules: []

externalSecret:
  enabled: false
  refreshInterval: "30s"
  secretStoreName: "custody-secret-store"
  targetSecretName: "custody-secrets"

# Extra ExternalSecrets rendered alongside the primary one above, for values
# that should reach only some services instead of the whole release. Each item
# pulls one AWS Secrets Manager secret into its own Kubernetes Secret, which a
# service then references via envFrom. Purely additive: an empty list renders
# nothing and leaves `externalSecret` behaviour untouched.
additionalExternalSecrets: []
# - name: custody-api-secret          # ExternalSecret resource name
#   awsSecretName: custody-api-secrets-dev
#   targetSecretName: custody-api-secrets
#   refreshInterval: "30s"            # optional, falls back to externalSecret.refreshInterval
#   secretStoreName: custody-secret-store  # optional, falls back to externalSecret.secretStoreName

secretStore:
  enabled: false
  name: "custody-secret-store"

networkPolicy:
  enabled: false
  ingressControllerNamespace: "kube-system"

pdb:
  enabled: false
  minAvailable: 1

migration:
  envFrom: []

monitoring:
  enabled: false
  metricsPath: /metrics
  scrapeInterval: 30s
