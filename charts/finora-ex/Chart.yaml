apiVersion: v2
# Renamed from "exchange" in v0.4.0 to match the chart directory and the release tag.
#
# The old name is still what lives in the cluster: it feeds selectorLabels
# (app.kubernetes.io/name, immutable via spec.selector) and prefixes resource names.
# Renaming is only safe because consumers pin `nameOverride: exchange` in their values,
# which holds the rendered identity steady — see templates/_helpers.tpl.
#
# A new consumer of this chart leaves nameOverride unset and gets "finora-ex".
name: finora-ex
description: Reusable Helm chart for the Finora Exchange stack (backend api/wss, frontend, admin, cms, nuxt, celery workers, in-cluster bitcoind)
type: application
version: 0.5.0
appVersion: "1.0.0"
keywords:
  - exchange
  - finora
  - gitops
maintainers:
  - name: DevOps
