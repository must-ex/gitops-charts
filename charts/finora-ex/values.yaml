# Holds app.kubernetes.io/name (and the <name>-secret / -migrate / -default-deny
# resource prefixes) at a fixed string instead of the chart name. Empty = use the
# chart name. Existing environments set "exchange"; they were created under the
# chart's old name and spec.selector cannot be changed after the fact.
nameOverride: ""

global:
  ecrRegistry: ""
  esoSecretName: ""
  esoRoleArn: ""
  awsRegion: "ap-northeast-2"
  domain: ""
  acmCertificateArn: ""

# Pod-level security context applied to all pods.
# Override per service via services.<name>.podSecurityContext / .securityContext.
securityContext:
  pod: {}
  container: {}

# Chart-level ServiceAccount. The exchange stack typically uses per-service SAs
# (services.<n>.serviceAccount) for IRSA, so this is opt-in (set create: false
# unless a shared SA is needed, e.g. for the ESO SecretStore).
serviceAccount:
  create: false
  name: ""

# Services map. Each entry renders a Deployment (+ optional Service).
# Common shape:
#   <name>:
#     enabled: true
#     image: { repository: ..., tag: ... }
#     replicaCount: 2
#     containerPort: 8080
#     envFrom: [{ secretRef: { name: mustex-secrets } }]
#     command: ["celery", "..."]              # optional, non-default entrypoint (workers, daphne)
#     reloader: true                          # Reloader auto-rolls on Secret/CM change
#     unifiedServiceTagging: true             # Datadog USTagging: tags.datadoghq.com/* labels + DD_ENV/DD_SERVICE/DD_VERSION
#     serviceAccount:                         # optional per-service IRSA
#       create: true
#       name: mustex-cms-sa
#       annotations:
#         eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/<role>
#     probes: { startup, liveness, readiness }
#     resources: { requests, limits }
#     service: { enabled, port, type }        # ClusterIP svc for api/wss/frontend/admin/cms/nuxt
#     hpa: { enabled, minReplicas, maxReplicas, targetCPUUtilizationPercentage }
services: {}

# StatefulSets map — for in-cluster stateful workloads (e.g. bitcoind).
# Each enabled entry renders a StatefulSet + a headless Service (clusterIP: None)
# with a per-pod PVC via volumeClaimTemplates.
# Common shape:
#   <name>:
#     enabled: true
#     image: { repository: lncm/bitcoind, tag: v24.0.1 }
#     replicas: 1
#     containerPort: 8332
#     command: ["sh", "-c", "mkdir -p /data/.bitcoin && ... && bitcoind -datadir=/data/.bitcoin"]
#     envFrom: [{ secretRef: { name: mustex-secrets } }]
#     resources: { requests, limits }
#     persistence:
#       mountPath: /data/.bitcoin
#       size: 100Gi
#       storageClassName: gp2
statefulsets: {}

# ExternalName Services — alias for managed/external infra (RDS, ElastiCache, MQ).
# Defaults are empty; each environment's values.yaml supplies real hostnames.
# See templates/external-services.yaml for shape.
externalServices: {}
# Example:
#   externalServices:
#     mustex-postgresql:
#       enabled: true
#       host: mustex-postgres-dev.c58e2ysuka9x.ap-northeast-2.rds.amazonaws.com
#       port: 5432
#     mustex-redis:
#       enabled: true
#       host: mustex-redis-dev.lmjrar.0001.apn2.cache.amazonaws.com
#       port: 6379
#     mustex-rabbitmq:
#       enabled: true
#       host: b-xxxx.mq.ap-northeast-2.on.aws
#       port: 5671
#       extraPorts: [443]

# A single Ingress. Kept as-is for envs that only need one ALB (dev, stg).
ingress:
  enabled: false
  className: alb
  annotations: {}
  # rules is a list of { host, paths: [{ path, pathType, backend: { service: { name, port } } }] }
  rules: []

# Named Ingresses, for envs that front more than one ALB. Renders one Ingress per
# enabled entry, through the same template as `ingress:` above. The map key is the
# default object name; set `name:` to override it.
#
# Use this instead of `ingress:` when the load balancers differ in certificate,
# health-check path, or scheme — folding them into one Ingress would put every host
# behind a single ALB.
#
#   ingresses:
#     finora-ex-prod:
#       enabled: true
#       className: alb
#       annotations:
#         alb.ingress.kubernetes.io/load-balancer-name: finora-ex-prod-alb
#         alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:...:certificate/..."
#         alb.ingress.kubernetes.io/healthcheck-path: /api/public/v1/healthcheck
#       rules:
#         - host: www.finora.exchange
#           paths:
#             - path: /api
#               backend: {service: {name: finora-ex-api, port: 8080}}
#     finora-ex-prod-finoraglobal:
#       enabled: true
#       annotations:
#         alb.ingress.kubernetes.io/load-balancer-name: finora-ex-prod-finoraglobal
#         alb.ingress.kubernetes.io/healthcheck-path: /health
#       rules:
#         - host: www.finora.holdings
#           paths:
#             - path: /
#               backend: {service: {name: finora-ex-finoraglobal, port: 8080}}
ingresses: {}

externalSecret:
  enabled: false
  refreshInterval: "30s"
  secretStoreName: "mustex-secret-store"
  targetSecretName: "mustex-secrets"

secretStore:
  enabled: false
  name: "mustex-secret-store"

networkPolicy:
  enabled: false
  ingressControllerNamespace: "kube-system"

pdb:
  enabled: false
  minAvailable: 1

# Migration Job (PostSync hook). Runs Django migrate against the backend image.
migration:
  enabled: false
  # Which entry in .Values.services provides the image for the migration container.
  imageSourceService: "mustex-api"
  # Optional override; defaults to ["python", "manage.py", "migrate", "--noinput"].
  command: []
  envFrom: []
  resources: {}

monitoring:
  enabled: false
  metricsPath: /metrics
  scrapeInterval: 30s
