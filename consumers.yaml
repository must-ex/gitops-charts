# Registry of product gitops repos that consume charts in this repo.
# Used by .github/workflows/impact-preview.yml to render diffs on chart PRs.
#
# Add a new entry when a new product onboards.

consumers:
  - repo: must-custody/custody-gitops
    chart: custody
    envs:
      - path: envs/dev/custody/values.yaml
      - path: envs/prod/custody/values.yaml
  - repo: must-stonex/finora-sto-gitops
    chart: finora-sto
    envs:
      - path: envs/dev/values.yaml
      - path: envs/prod/values.yaml
  - repo: must-ex/finora-ex-gitops
    chart: finora-ex
    envs:
      - path: envs/dev/values.yaml
      - path: envs/stg/values.yaml
      - path: envs/prod/values.yaml
  - repo: must-ex/infra-gitops
    chart: datadog
    envs:
      - path: envs/dev/values-datadog.yaml
      # Both prod clusters run this chart too, and each has its own values file.
      # Registering dev alone meant impact-preview could not surface a chart change
      # that only broke a prod env — the one place it matters most. Datadog is the
      # only chart deployed to all three clusters, so it is also the only one where
      # this gap existed.
      - path: envs/custody-prod/values-datadog.yaml
      - path: envs/finora-prod/values-datadog.yaml
